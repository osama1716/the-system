<!DOCTYPE html>
<!-- The old address (osama1716.github.io/the-system/) after the move to the
     app's own domain: GitHub Pages serves this folder instead of the app,
     and it sends every visitor on, keeping an invite link's #invite=… part.
     Inert until GitHub Pages is switched to the /docs folder (DOMAIN-MOVE.md).
     A template: scripts/domain-move.js writes it, with the domain filled in,
     to docs/index.html and docs/404.html. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The System has moved</title>
<meta name="robots" content="noindex" />
<link rel="canonical" href="https://NEW_DOMAIN/" />
<meta http-equiv="refresh" content="0; url=https://NEW_DOMAIN/" />
<script>location.replace("https://NEW_DOMAIN/" + location.hash);</script>
<style>body{background:#100d0a;color:#e8dcc4;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0}a{color:#d9b56a}</style>
</head>
<body><p>The System has moved to <a href="https://NEW_DOMAIN/">NEW_DOMAIN</a>.</p></body>
</html>
