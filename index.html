<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The System</title>
<!-- Carries its own dark tile rather than being transparent: a tab strip can
       be light or dark and an unbacked mark disappears into one of them. -->
<link rel="icon" type="image/png" href="icons/favicon-32-v2.png" />
<link rel="apple-touch-icon" href="icons/icon-192-v2.png" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192-v2.png" />
<meta name="theme-color" content="#100d0a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- What makes the flames in the rank emblems move. Each filter warps its
       input by a still field of noise; three of them, with different seeds,
       are cross-faded over the emblem's light so the wisps morph from one
       shape to another and back. An animated turbulence would have been one
       filter instead of three, but SMIL does not run here, and three still
       ones are cheaper anyway: each rasterises once and only opacity moves
       after that.
       `primitiveUnits="objectBoundingBox"` is what lets the same three serve
       a 200px emblem on the rank-up and a 66px one under the dial — the
       displacement is a share of the element, not a count of pixels. -->
  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute;left:-9999px">
    <filter id="flameWarp1" x="-25%" y="-25%" width="150%" height="150%"
            primitiveUnits="objectBoundingBox" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="7 16" numOctaves="2" seed="11" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="0.034" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="flameWarp2" x="-25%" y="-25%" width="150%" height="150%"
            primitiveUnits="objectBoundingBox" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="7 16" numOctaves="2" seed="29" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="0.034" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="flameWarp3" x="-25%" y="-25%" width="150%" height="150%"
            primitiveUnits="objectBoundingBox" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="7 16" numOctaves="2" seed="47" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="0.034" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>
  <div id="app">
    <nav id="sidebar" class="sidebar"></nav>
    <div class="content-area">
      <div id="statusbar" class="statusbar"></div>
      <div id="page" class="page">
        <div class="boot-screen">SYSTEM INITIALIZING...</div>
      </div>
    </div>
  </div>

  <div id="notif-stack" class="notif-stack" aria-live="polite"></div>
  <div id="rankup-layer"></div>
  <div id="modal-layer"></div>
  <input type="file" id="feedback-shot-input" accept="image/*" class="visually-hidden" aria-hidden="true" tabindex="-1" />
  <input type="file" id="import-file-input" accept="application/json" class="visually-hidden" aria-hidden="true" tabindex="-1" />

  <!-- Optional cloud sync — safe to be offline/unconfigured; everything else
       works without these ever loading. See README for setup. -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-check-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/appcheck-config.js"></script>

  <script src="js/i18n.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/state-merge.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/planner-sync.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/push.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Only works over https (or localhost) — silently no-ops on file:// or plain http.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
