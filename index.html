<!DOCTYPE html>

<head>
<meta charset="UTF-8" />
<!-- What this page may load and run. A meta tag because GitHub Pages sets no
     headers. Scripts: this site, Firebase's SDK (pinned by integrity below),
     Google sign-in and reCAPTCHA (App Check) — and one inline script, the
     theme below, allowed by its hash. Editing that script changes its hash:
     tests/test-csp.js recomputes it and fails until this line is updated.
     Styles stay 'unsafe-inline' because the app renders style="" attributes
     throughout; an injected style cannot run code. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-E7lF1IdPuoxVhKwrHvV8QjbJlrNYz9/hbo27dETEHrM=' https://www.gstatic.com https://apis.google.com https://www.google.com https://recaptcha.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com https://www.gstatic.com; media-src 'self' blob:; connect-src 'self' https://*.googleapis.com https://*.cloudfunctions.net https://*.firebaseapp.com https://www.google.com https://recaptcha.google.com https://apis.google.com https://www.gstatic.com; frame-src https://the-system-44ff7.firebaseapp.com https://www.google.com https://recaptcha.google.com https://apis.google.com https://accounts.google.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The System</title>
<!-- Carries its own dark tile rather than being transparent: a tab strip can
       be light or dark and an unbacked mark disappears into one of them. -->
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32-v3.png" />
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64-v3.png" />
<link rel="apple-touch-icon" href="icons/icon-192-v2.png" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192-v2.png" />
<meta name="theme-color" content="#100d0a" />
<script>
  // The theme, before any of the app has loaded. styles.css can only hardcode
  // one palette at :root and there are seven, so the other six used to flash
  // it on every load - a light theme flashed black. SYS.applyTheme leaves the
  // resolved palette in localStorage; this writes it onto the document in the
  // same tick the HTML is parsed, which is why it is inline and tiny rather
  // than a second request before the first pixel. The key and the camelCase
  // -> --kebab-case rule are SYS.BOOT_THEME_KEY and cssVarName in
  // js/constants.js; this is the only copy of them outside that file.
  (function () {
    try {
      var t = JSON.parse(localStorage.getItem("sys.boot-theme") || "null");
      if (!t || !t.pageBg) return;
      var r = document.documentElement;
      r.setAttribute("data-theme", t.dark ? "dark" : "light");
      Object.keys(t).forEach(function (k) {
        if (k === "dark") return;
        r.style.setProperty("--" + k.replace(/[A-Z]/g, function (c) { return "-" + c.toLowerCase(); }), t[k]);
      });
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute("content", t.pageBg);
    } catch (e) { /* no storage, or a crumb from an older shape: :root stands */ }
  })();
</script>
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="styles.css" />
</head>
